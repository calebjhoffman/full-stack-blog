# fly.toml app configuration file generated for mini-blog-api on 2025-07-28T08:59:19-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mini-blog-api'
primary_region = 'iad'

[build]
dockerfile = "Dockerfile.prod"
context = "."

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = "uploads"
  destination = "/app/uploads"
